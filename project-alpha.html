<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Alpha - Cursed Energy Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a0a1a);
            color: #ffeb3b;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 235, 59, 0.3);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 20px #ffeb3b;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #fdd835;
            font-size: 1.2rem;
        }

        .tracker-panel {
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ffeb3b;
            box-shadow: 0 0 40px rgba(255, 235, 59, 0.2);
            margin-bottom: 20px;
        }

        .energy-display {
            text-align: center;
            margin: 30px 0;
        }

        .energy-value {
            font-size: 4rem;
            font-weight: bold;
            color: #ff3d00;
            text-shadow: 0 0 30px #ff3d00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .energy-bar-container {
            width: 100%;
            height: 40px;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #ffeb3b;
            margin: 20px 0;
        }

        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff3d00, #ff6f00, #ffeb3b);
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 61, 0, 0.8);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        button {
            background: #ffeb3b;
            border: none;
            color: #121212;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 235, 59, 0.4);
        }

        button:hover {
            background: #fdd835;
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 235, 59, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .beast-detector {
            margin-top: 30px;
            padding: 20px;
            background: rgba(26, 0, 26, 0.8);
            border-radius: 10px;
            border: 1px solid #9c27b0;
        }

        .beast-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .beast-card {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff3d00;
            transition: transform 0.3s ease;
        }

        .beast-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 61, 0, 0.5);
        }

        .beast-name {
            font-weight: bold;
            color: #ff6f00;
            margin-bottom: 5px;
        }

        .beast-threat {
            font-size: 0.9rem;
            color: #fdd835;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #ffeb3b;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #ffeb3b;
            color: #121212;
        }

        .ai-analysis {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 20, 40, 0.8);
            border-radius: 8px;
            border-left: 4px solid #00bcd4;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ PROJECT ALPHA ⚡</h1>
            <p class="subtitle">Advanced Cursed Energy Tracking System</p>
        </header>

        <div class="tracker-panel">
            <h2 style="text-align: center; margin-bottom: 20px;">Energy Monitor</h2>
            
            <div class="energy-display">
                <div class="energy-value" id="energyValue">0</div>
                <div style="color: #fdd835; margin-top: 10px;">CURSED ENERGY UNITS</div>
            </div>

            <div class="energy-bar-container">
                <div class="energy-bar" id="energyBar" style="width: 0%"></div>
            </div>

            <div class="controls">
                <button onclick="scanEnergy()">🔍 Scan Area</button>
                <button onclick="absorbEnergy()">⚡ Absorb Energy</button>
                <button onclick="releaseEnergy()">💥 Release Energy</button>
                <button onclick="resetEnergy()">🔄 Reset</button>
            </div>

            <div class="ai-analysis" id="aiAnalysis">
                <span class="status-indicator" style="background: #00ff00;"></span>
                <strong>Spy Analysis:</strong> System ready. Awaiting energy detection...
            </div>
        </div>

        <div class="beast-detector">
            <h2 style="text-align: center; margin-bottom: 15px;">
                <span class="status-indicator" style="background: #ff3d00;"></span>
                Shadow Beast Detector
            </h2>
            <button onclick="detectBeasts()" style="width: 100%; margin-bottom: 15px;">
                👁️ Scan for Shadow Beasts
            </button>
            <div class="beast-list" id="beastList"></div>
        </div>

        <div style="text-align: center;">
            <a href="home.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <script>
        let currentEnergy = 0;
        const maxEnergy = 1000;

        const beasts = [
            { name: "Void Stalker", threat: "High", emoji: "👹" },
            { name: "Shadow Wraith", threat: "Critical", emoji: "👻" },
            { name: "Cursed Hound", threat: "Medium", emoji: "🐺" },
            { name: "Dark Serpent", threat: "High", emoji: "🐍" },
            { name: "Nightmare Entity", threat: "Critical", emoji: "😈" },
            { name: "Spectral Wolf", threat: "Medium", emoji: "🌑" }
        ];

        function updateEnergyDisplay() {
            document.getElementById('energyValue').textContent = currentEnergy;
            const percentage = (currentEnergy / maxEnergy) * 100;
            document.getElementById('energyBar').style.width = percentage + '%';
            
            let status = '';
            let color = '';
            if (currentEnergy < 300) {
                status = 'Low energy detected. Safe zone.';
                color = '#00ff00';
            } else if (currentEnergy < 600) {
                status = 'Moderate energy levels. Caution advised.';
                color = '#ffeb3b';
            } else if (currentEnergy < 900) {
                status = 'High energy detected! Danger zone!';
                color = '#ff6f00';
            } else {
                status = '⚠️ CRITICAL LEVELS! IMMINENT CURSE MANIFESTATION!';
                color = '#ff3d00';
            }
            
            document.getElementById('aiAnalysis').innerHTML = `
                <span class="status-indicator" style="background: ${color};"></span>
                <strong>Spy Analysis:</strong> ${status}
            `;
        }

        function scanEnergy() {
            const increment = Math.floor(Math.random() * 150) + 50;
            currentEnergy = Math.min(currentEnergy + increment, maxEnergy);
            updateEnergyDisplay();
        }

        function absorbEnergy() {
            const absorption = Math.floor(Math.random() * 100) + 80;
            currentEnergy = Math.min(currentEnergy + absorption, maxEnergy);
            updateEnergyDisplay();
        }

        function releaseEnergy() {
            const release = Math.floor(Math.random() * 200) + 100;
            currentEnergy = Math.max(currentEnergy - release, 0);
            updateEnergyDisplay();
        }

        function resetEnergy() {
            currentEnergy = 0;
            updateEnergyDisplay();
        }

        function detectBeasts() {
            const beastList = document.getElementById('beastList');
            beastList.innerHTML = '';
            
            const numBeasts = Math.floor(Math.random() * 4) + 2;
            const detectedBeasts = [];
            
            for (let i = 0; i < numBeasts; i++) {
                const beast = beasts[Math.floor(Math.random() * beasts.length)];
                detectedBeasts.push(beast);
            }
            
            detectedBeasts.forEach(beast => {
                const card = document.createElement('div');
                card.className = 'beast-card';
                card.innerHTML = `
                    <div class="beast-name">${beast.emoji} ${beast.name}</div>
                    <div class="beast-threat">Threat: ${beast.threat}</div>
                `;
                beastList.appendChild(card);
            });
        }

        updateEnergyDisplay();
    </script>
</body>
</html>
